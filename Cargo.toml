[package]
name = "toolswitch"
version = "0.1.0"
edition = "2024"
description = "Small everyday tools in one tiny app: wallpapers, clipboard history, image compressor, screen OCR, background remover"
license = "MIT"

[dependencies]
global-hotkey = "=0.8.0"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
color_quant = "=2.0.0"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
jpeg-encoder = "=0.7.1"
lopdf = { version = "=0.45.0", default-features = false }
ocrs = { version = "=0.13.1", default-features = false, features = ["onnx"] }
png = "=0.18.1"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
rten = { version = "=0.26.0", default-features = false, features = ["onnx_format"] }
rten-tensor = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# For the screenshot portal on Wayland; the same versions ksni already brings.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt"] }
futures-util = { version = "=0.3.34", default-features = false }
ksni = { version = "=0.3.6", features = ["blocking"] }
x11rb = { version = "=0.13.2", features = ["randr", "xfixes"] }
# Only to pick the X11 backend; the same version eframe already brings.
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "=0.26.0"
xcap = "=0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
notify-rust = "=4.18.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The heavy math (AI models, image codecs) is optimized for speed; the rest stays small.
[profile.release.package.rten]
opt-level = 3
[profile.release.package.rten-tensor]
opt-level = 3
[profile.release.package.rten-vecmath]
opt-level = 3
[profile.release.package.rten-simd]
opt-level = 3
[profile.release.package.rten-gemm]
opt-level = 3
[profile.release.package.rten-base]
opt-level = 3
[profile.release.package.rten-imageproc]
opt-level = 3
[profile.release.package.ocrs]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.release.package.color_quant]
opt-level = 3
[profile.release.package.rten-parallel]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
