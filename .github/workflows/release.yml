name: Release

# Builds the toolswitch installers for Linux (.deb and .tar.gz), Windows (setup .exe) and macOS
# (.dmg, Apple Silicon and Intel) and attaches them to the GitHub release of the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh target/${{ matrix.target }}/release/toolswitch "${TAG#v}"
          mkdir -p out/toolswitch
          cp target/${{ matrix.target }}/release/toolswitch README.md out/toolswitch/
          tar -czf toolswitch-$TAG-${{ matrix.name }}.tar.gz -C out toolswitch
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = $env:TAG.TrimStart('v')
          & $iscc "/DVersion=$version" "/DBinary=$PWD\target\${{ matrix.target }}\release\toolswitch.exe" packaging\windows\toolswitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=out/toolswitch.app/Contents
          mkdir -p $app/MacOS $app/Resources
          cp target/${{ matrix.target }}/release/toolswitch $app/MacOS/
          sed "s/VERSION/${TAG#v}/" packaging/Info.plist > $app/Info.plist
          # The icon: every size Finder asks for, from the 1024 px one.
          set=icon.iconset
          mkdir $set
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon-1024.png --out $set/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/icon-1024.png --out $set/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns $set -o $app/Resources/toolswitch.icns
          # Ad hoc signature (no paid certificate): the first time, right-click > Open.
          codesign --force --deep --sign - out/toolswitch.app
          ln -s /Applications out/Applications
          hdiutil create -volname toolswitch -srcfolder out -format UDZO toolswitch-$TAG-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: toolswitch-${{ matrix.name }}
          path: |
            toolswitch*.deb
            toolswitch-*.tar.gz
            toolswitch-*-setup.exe
            toolswitch-*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" files/* --clobber
